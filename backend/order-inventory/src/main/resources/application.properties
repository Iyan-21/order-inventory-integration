spring.application.name=order-inventory

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
legacysupply.base-url=https://legacysupply.onrender.com/api/v1
legacysupply.client-id=${LS_CLIENT_ID}
legacysupply.api-key=${LS_API_KEY}
tiangge.base-url=${TIANGGE_BASE_URL:https://legacysupply.onrender.com/tiangge/v1}
# several scheduled jobs (heartbeat, feed poller, retries, delivery tracking) must not block each other
spring.task.scheduling.pool.size=8
